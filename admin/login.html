<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login · MERIDIAN Admin</title>
  <link rel="shortcut icon" href="../assets/images/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page">

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="../assets/images/logo/logo.svg" alt="MERIDIAN" width="200">
        <p class="auth-tagline">Admin Console</p>
      </div>
      <h1 class="auth-title">Staff Sign in</h1>
      <p class="auth-sub">Access the MERIDIAN store administration.</p>

      <form data-login-form>
        <div class="field">
          <label>Store</label>
          <input type="text" name="store" value="meridian" placeholder="meridian" autocomplete="off">
        </div>
        <div class="field">
          <label>Email address</label>
          <input type="email" name="email" placeholder="you@meridianwatch.com" required autofocus>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <p class="form-error" data-login-error></p>
        <button type="submit" class="btn-admin btn-primary btn-block">Sign in</button>
      </form>

      <div class="auth-demo">
        <p><b>Demo credentials</b> (all users share the password)</p>
        <p class="mono">admin@meridianwatch.com · admin123</p>
        <p class="mono">manager@meridianwatch.com · admin123</p>
        <p class="mono">orders@meridianwatch.com · admin123</p>
        <p class="mono">catalog@meridianwatch.com · admin123</p>
      </div>
    </div>
  </main>

  <script src="../assets/js/models.js"></script>
  <script src="../assets/js/api-adapter.js"></script>
  <script src="../assets/js/store.js"></script>
  <script>
    (function () {
      'use strict';
      var form = document.querySelector('[data-login-form]');
      var err = document.querySelector('[data-login-error]');
      try {
        var pref = sessionStorage.getItem('anon.signin_store');
        var storeInput = form.querySelector('input[name="store"]');
        if (pref && storeInput) { storeInput.value = pref; sessionStorage.removeItem('anon.signin_store'); }
      } catch (e) {}
      console.log('[Login] form found:', !!form);
      console.log('[Login] AnonStore:', typeof AnonStore, 'AnonAPI:', typeof AnonAPI);
      console.log('[Login] API base:', (window.AnonAPI && window.AnonAPI.api) ? window.AnonAPI.api.base : 'N/A');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.textContent = '';
        var fd = new FormData(form);
        console.log('[Login] submitting...', fd.get('email'));
        try {
          var res = AnonStore.adminLogin(fd.get('email'), fd.get('password'), fd.get('store') || 'meridian');
          function onSuccess(r) {
            console.log('[Login] result:', JSON.stringify(r));
            if (!r || !r.ok) { err.textContent = (r && r.error) || 'Login failed'; return; }
            window.location.href = 'index.html';
          }
          if (res && typeof res.then === 'function') {
            res.then(onSuccess).catch(function(e) { console.error('[Login] error:', e); err.textContent = 'Network error: ' + e.message; });
          } else {
            onSuccess(res);
          }
        } catch(e) { console.error('[Login] exception:', e); err.textContent = 'Error: ' + e.message; }
      });
    })();
  </script>
</body>

</html>
