<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — MERIDIAN</title>
  <meta name="description" content="Get in touch with MERIDIAN. Questions, sizing help or service requests — we reply within one business day.">
  <link rel="shortcut icon" href="./assets/images/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style-prefix.css">
  <link rel="stylesheet" href="./assets/css/store.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body data-page="contact">

  <header id="site-header"></header>

  <main>
    <div class="page-header">
      <p class="page-kicker">Get in touch</p>
      <h1 class="page-title">Contact Us</h1>
      <p class="page-sub">We'd love to hear from you.</p>
      <nav class="breadcrumb"><a href="/">Shop</a> / <span>Contact</span></nav>
    </div>

    <div class="container" style="padding:40px 15px 60px">
      <div class="contact-grid">
        <div class="contact-info" id="contact-info"></div>
        <form class="contact-form" id="contact-form">
          <div class="form-grid">
            <label class="form-field">
              <span>Name</span>
              <input type="text" name="name" required>
            </label>
            <label class="form-field">
              <span>Email</span>
              <input type="email" name="email" required>
            </label>
          </div>
          <label class="form-field">
            <span>Subject</span>
            <select name="subject" required>
              <option value="">Select a subject</option>
            </select>
          </label>
          <label class="form-field">
            <span>Message</span>
            <textarea name="message" rows="6" required></textarea>
          </label>
          <button type="submit" class="btn wa-btn btn-block">Send on WhatsApp</button>
          <p class="pod-note" style="margin-top:12px">Your message opens directly in WhatsApp — no backend required.</p>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="./assets/js/client-data.js"></script>
  <script src="./assets/js/models.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/ui.js"></script>
  <script src="./assets/js/pages.js"></script>
  <script src="./assets/js/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
