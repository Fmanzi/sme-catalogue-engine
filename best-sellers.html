<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Sellers — MERIDIAN</title>
  <meta name="description" content="Our most popular timepieces. Shop the watches our customers love most.">
  <link rel="shortcut icon" href="./assets/images/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style-prefix.css">
  <link rel="stylesheet" href="./assets/css/store.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body data-page="listing">

  <header id="site-header"></header>

  <main>
    <div class="page-header">
      <p class="page-kicker">Customer favourites</p>
      <h1 class="page-title">Best Sellers</h1>
      <p class="page-sub">Our most-loved products, chosen by customers.</p>
      <nav class="breadcrumb"><a href="/">Shop</a> / <span>Best Sellers</span></nav>
    </div>

    <div class="container-wide" style="padding:34px 15px 60px">
      <div class="shop-toolbar">
        <p class="result-count" id="result-count"></p>
        <label style="display:flex;align-items:center;gap:10px">
          <span style="font-size:var(--fs-8);color:var(--text-soft)">Sort by</span>
          <select id="shop-sort">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top rated</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>
      </div>
      <div class="product-grid" id="shop-grid" data-default-filter='{"status":"best"}'></div>
      <div id="shop-pagination"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="./assets/js/client-data.js"></script>
  <script src="./assets/js/models.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/ui.js"></script>
  <script src="./assets/js/pages.js"></script>
  <script src="./assets/js/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
