<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Luxury wristwatch">

    <defs>
      <linearGradient id="dialG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f4ece0"/>
        <stop offset="100%" stop-color="#e9dcc8"/>
      </linearGradient>
      <radialGradient id="caseG" cx="0.38" cy="0.32" r="0.9">
        <stop offset="0%" stop-color="#e0b185"/>
        <stop offset="70%" stop-color="#e0b185"/>
        <stop offset="100%" stop-color="#6f757e"/>
      </radialGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.22"/>
      </filter>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#c0392b" flood-opacity="0.55"/>
      </filter>
    </defs>
  <!-- straps -->
  <rect x="146" y="0" width="108" height="92" rx="22" fill="#2c221d"/>
  <rect x="146" y="308" width="108" height="92" rx="22" fill="#2c221d"/>
  <!-- stitching -->
  <line x1="158" y1="6" x2="158" y2="88" stroke="#33281d" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="242" y1="6" x2="242" y2="88" stroke="#33281d" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="158" y1="312" x2="158" y2="394" stroke="#33281d" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="242" y1="312" x2="242" y2="394" stroke="#33281d" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- lugs -->
  <rect x="134" y="78" width="132" height="38" rx="12" fill="#e0b185"/>
  <rect x="134" y="284" width="132" height="38" rx="12" fill="#e0b185"/>
  <!-- case group -->
  <g filter="url(#soft)">
    <circle cx="200" cy="200" r="122" fill="url(#caseG)"/>
    <circle cx="200" cy="200" r="112" fill="none" stroke="#c88e5a" stroke-width="6"/>
    <circle cx="200" cy="200" r="104" fill="none" stroke="#000" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="200" cy="200" r="92" fill="url(#dialG)"/>
    <circle cx="200" cy="200" r="92" fill="none" stroke="#000" stroke-opacity="0.10" stroke-width="2"/>
  </g>
  <!-- hour track -->
  <circle cx="200" cy="200" r="82" fill="none" stroke="#8a5a38" stroke-opacity="0.25" stroke-width="0.8"/>
  <line x1="200.0" y1="134.0" x2="200.0" y2="126.0" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="233.0" y1="142.8" x2="237.0" y2="135.9" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="257.2" y1="167.0" x2="264.1" y2="163.0" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="266.0" y1="200.0" x2="274.0" y2="200.0" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="257.2" y1="233.0" x2="264.1" y2="237.0" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="233.0" y1="257.2" x2="237.0" y2="264.1" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="200.0" y1="266.0" x2="200.0" y2="274.0" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="167.0" y1="257.2" x2="163.0" y2="264.1" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="142.8" y1="233.0" x2="135.9" y2="237.0" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="134.0" y1="200.0" x2="126.0" y2="200.0" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="142.8" y1="167.0" x2="135.9" y2="163.0" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="167.0" y1="142.8" x2="163.0" y2="135.9" stroke="#8a5a38" stroke-width="3.4" stroke-linecap="round"/>
  
  
  <!-- hands -->
  <g stroke-linecap="round">
    <rect x="197" y="146" width="6" height="62" rx="3" fill="#5d4030" transform="rotate(-40 200 200)"/>
    <rect x="198.6" y="118" width="2.8" height="86" rx="1.4" fill="#5d4030" transform="rotate(8 200 200)"/>
    <line x1="200" y1="208" x2="200" y2="126" stroke="#c0392b" stroke-width="1.6" transform="rotate(142 200 200)"/>
  </g>
  <circle cx="200" cy="200" r="6" fill="#5d4030"/>
  <circle cx="200" cy="200" r="2.4" fill="#c0392b"/>
  <!-- dial text -->
  <text x="200" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3.5" fill="#a07a5a" text-anchor="middle">MERIDIAN</text>
  <text x="200" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="7" letter-spacing="2" fill="#a07a5a" text-anchor="middle">AUTOMATIC</text>
  <rect x="312" y="186" width="12" height="28" rx="5" fill="#e0b185" stroke="#6f757e" stroke-width="1"/>
       <rect x="324" y="191" width="6" height="18" rx="3" fill="#e0b185" stroke="#6f757e" stroke-width="1"/>
</svg>