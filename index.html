<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERIDIAN — Fine Timepieces</title>
  <meta name="description" content="Premium watches for every style. Shop men's, women's and unisex timepieces with same-day delivery in Nairobi.">
  <link rel="shortcut icon" href="./assets/images/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style-prefix.css">
  <link rel="stylesheet" href="./assets/css/store.css">
  <link rel="stylesheet" href="./assets/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body data-page="home">
  <header id="site-header"></header>

  <main>
    <div class="hero-section" id="hero-section"></div>

    <section class="home-section">
      <div class="container-wide">
        <div class="section-head">
          <p class="section-kicker">Just In</p>
          <h2 class="section-title">New Arrivals</h2>
        </div>
        <div class="product-grid" id="new-arrivals-grid"></div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">
          <a href="shop.html?status=new" class="btn btn-primary btn-block">View All New Arrivals <ion-icon name="arrow-forward-outline"></ion-icon></a>
          <a href="shop.html" class="btn btn-outline btn-block">View All Products</a>
        </div>
      </div>
    </section>

    <section class="home-section">
      <div class="container-wide">
        <div class="section-head">
          <p class="section-kicker">Curated</p>
          <h2 class="section-title">Featured</h2>
        </div>
        <div class="product-grid" id="featured-timepieces-grid"></div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">
          <a href="shop.html?status=featured" class="btn btn-primary btn-block">View All Featured <ion-icon name="arrow-forward-outline"></ion-icon></a>
          <a href="shop.html" class="btn btn-outline btn-block">View All Products</a>
        </div>
      </div>
    </section>

    <section class="home-section">
      <div class="container-wide">
        <div class="section-head">
          <p class="section-kicker">For Him</p>
          <h2 class="section-title">Men's Picks</h2>
        </div>
        <div class="product-grid" id="mens-picks-grid"></div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">
          <a href="shop.html?gender=men" class="btn btn-primary btn-block">View All Men's <ion-icon name="arrow-forward-outline"></ion-icon></a>
          <a href="shop.html" class="btn btn-outline btn-block">View All Products</a>
        </div>
      </div>
    </section>

    <section class="home-section">
      <div class="container-wide">
        <div class="section-head">
          <p class="section-kicker">For Her</p>
          <h2 class="section-title">Women's Picks</h2>
        </div>
        <div class="product-grid" id="womens-picks-grid"></div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">
          <a href="shop.html?gender=women" class="btn btn-primary btn-block">View All Women's <ion-icon name="arrow-forward-outline"></ion-icon></a>
          <a href="shop.html" class="btn btn-outline btn-block">View All Products</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="./assets/js/client-data.js"></script>
  <script src="./assets/js/models.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/ui.js"></script>
  <script src="./assets/js/pages.js"></script>
  <script src="./assets/js/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
