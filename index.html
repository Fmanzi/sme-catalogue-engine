<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERIDIAN — Fine Timepieces</title>
  <meta name="description" content="Premium watches for every style. Shop men's, women's and unisex timepieces with same-day delivery in Nairobi.">
  <link rel="shortcut icon" href="./assets/images/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style-prefix.css">
  <link rel="stylesheet" href="./assets/css/store.css">
  <link rel="stylesheet" href="./assets/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body data-page="shop">
  <header id="site-header"></header>

  <main>
    <div class="hero-section" id="hero-section"></div>

    <div class="container-wide">
      <div class="shop-layout">
        <div class="shop-controls">
          <div class="control-row control-row-main">
            <p class="result-count" id="result-count"></p>
            <label class="sort-control">
              <span>Sort by</span>
              <select id="shop-sort">
                <option value="featured">Featured</option><option value="newest">Newest</option>
                <option value="price-asc">Price: Low to High</option><option value="price-desc">Price: High to Low</option>
                <option value="rating">Top rated</option><option value="name">Name A–Z</option>
              </select>
            </label>
          </div>
          <div class="control-row control-row-filters">
            <div class="shop-mega">
              <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false">
                <span class="filter-toggle-label" id="filter-toggle-label">All Products</span>
                <ion-icon name="funnel-outline"></ion-icon>
              </button>
              <aside class="filter-panel" id="shop-filters" hidden>
                <div class="filter-groups">
                  <div class="filter-row-top">
                    <label class="filter-scope-btn"><input type="radio" name="f-scope" value="all">All Products</label>
                    <button class="btn btn-outline" id="filter-clear">Clear</button>
                  </div>
                  <div class="filter-columns">
                    <div class="filter-col">
                      <div class="filter-group"><h4>Gender</h4><div id="filter-gender"></div></div>
                      <div class="filter-group"><h4>Categories</h4><div id="filter-cats"></div></div>
                    </div>
                    <div class="filter-col">
                      <div class="filter-group"><h4>Collections</h4><div id="filter-collections"></div></div>
                      <div class="filter-group"><h4>Brand</h4><div id="filter-brands"></div></div>
                    </div>
                    <div class="filter-col">
                      <div class="filter-group"><h4>Price</h4><div id="filter-price"></div></div>
                      <div class="filter-group"><h4>Status</h4><div id="filter-status"></div></div>
                    </div>
                  </div>
                  <div id="filter-attributes"></div>
                </div>
              </aside>
            </div>
          </div>
        </div>

        <div class="chip-row" id="filter-chips"></div>
        <div class="product-grid" id="shop-grid"></div>
        <div id="shop-pagination"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="./assets/js/client-data.js"></script>
  <script src="./assets/js/models.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/ui.js"></script>
  <script src="./assets/js/pages.js"></script>
  <script src="./assets/js/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
